// ── CONSTANTS ─────────────────────────────────────────────────────────────────
const ALLERGEN_COLORS = {G:'#c8761e',D:'#2e78c7',E:'#d4a017',F:'#1fa3a8',C:'#c8326b',P:'#7a5230',N:'#6a9a2e',Se:'#9a8a2e',So:'#4e8c3a'};
const STRINGS = {
  bg: { allergens: 'Алергени', perm_title: 'АЛЕРГЕНИ', pill: '10% намаление за гости на хотела · Без код' },
  en: { allergens: 'Allergens', perm_title: 'ALLERGENS', pill: '10% off for hotel guests · No code needed' }
};

// ── STATE ─────────────────────────────────────────────────────────────────────
let lang = localStorage.getItem('sayulitaMenuLang') || 'bg';

// ── HELPERS ───────────────────────────────────────────────────────────────────
function itemName(item) {
  return item.name || (item.name_i18n && item.name_i18n[lang]) || '';
}

function badge(code) {
  return `<span class="a-badge" style="background:${ALLERGEN_COLORS[code]}">${code}</span>`;
}

function allergenEntry(code) {
  return `<div class="allergen-entry">${badge(code)}<span>${MENU.allergenKey[code][lang]}</span></div>`;
}

// ── RENDER CHIPS ──────────────────────────────────────────────────────────────
function renderChips() {
  const wrap = document.getElementById('js-chips');
  wrap.innerHTML = MENU.sections.map(s =>
    `<button class="chip" data-section="${s.id}">${s.name_es}</button>`
  ).join('');
  wrap.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const el = document.getElementById('sec-' + chip.dataset.section);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
}

// ── RENDER SECTIONS ───────────────────────────────────────────────────────────
function renderSections() {
  const main = document.getElementById('js-sections');
  main.innerHTML = MENU.sections.map(sec => {
    const items = sec.items.map(item => {
      const name = itemName(item);
      const desc = item.desc && item.desc[lang];
      const photo = item.photo
        ? `<div class="item-photo"><img src="${item.photo}" alt="${name}" loading="lazy"></div>`
        : '';
      const allergens = item.allergens.length
        ? `<div class="item-allergens">${item.allergens.map(badge).join('')}</div>`
        : '';
      const descHtml = desc ? `<p class="item-desc">${desc}</p>` : '';
      const priceHtml = item.price ? `<span class="item-price">${item.price}</span>` : '';
      const newBadge = item.isNew ? '<span class="new-badge">NEW</span>' : '';
      return `
        <div class="item-row">
          ${photo}
          <div class="item-text">
            <div class="item-name-row">
              <span class="item-name">${name}${newBadge}</span>
              ${priceHtml}
            </div>
            ${descHtml}
            ${allergens}
          </div>
        </div>`;
    }).join('');

    return `
      <section class="menu-section" id="sec-${sec.id}">
        <div class="section-header">
          <span class="section-name">${sec.name_es}</span>
          <span class="section-subtitle js-subtitle" data-id="${sec.id}">${sec.subtitle[lang]}</span>
        </div>
        ${items}
      </section>`;
  }).join('');
}

// ── RENDER ALLERGEN GRIDS ─────────────────────────────────────────────────────
function renderAllergenGrids() {
  const html = Object.keys(MENU.allergenKey).map(allergenEntry).join('');
  document.getElementById('js-allergen-top').innerHTML = html;
  document.getElementById('js-allergen-bottom').innerHTML = html;
}

// ── RENDER STATIC STRINGS ─────────────────────────────────────────────────────
function renderStrings() {
  const s = STRINGS[lang];
  document.getElementById('js-location').textContent = MENU.location[lang];
  document.getElementById('js-allergen-label').textContent = s.allergens;
  document.getElementById('js-allergen-perm-title').textContent = s.perm_title;
  document.getElementById('js-footer-pill').textContent = s.pill;
  document.getElementById('js-footer-location').textContent = MENU.location[lang];
  // subtitles (already in DOM after renderSections)
  document.querySelectorAll('.js-subtitle').forEach(el => {
    const sec = MENU.sections.find(s => s.id === el.dataset.id);
    if (sec) el.textContent = sec.subtitle[lang];
  });
  // item names & descs that are i18n
  document.getElementById('btn-bg').classList.toggle('active', lang === 'bg');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.querySelector('html').lang = lang;
}

// ── SWITCH LANG ───────────────────────────────────────────────────────────────
function setLang(l) {
  lang = l;
  localStorage.setItem('sayulitaMenuLang', lang);
  // Re-render sections (names/descs change) and strings
  renderSections();
  renderAllergenGrids();
  renderStrings();
  initScrollSpy();
}

// ── COLLAPSIBLE ALLERGEN KEY ──────────────────────────────────────────────────
function initCollapsible() {
  const btn = document.getElementById('js-allergen-toggle');
  const inner = document.getElementById('js-allergen-inner');
  const icon = document.getElementById('js-toggle-icon');
  btn.addEventListener('click', () => {
    const open = inner.classList.toggle('open');
    btn.classList.toggle('open', open);
    icon.textContent = open ? '–' : '+';
  });
}

// ── SCROLL SPY ────────────────────────────────────────────────────────────────
let observer;
function initScrollSpy() {
  if (observer) observer.disconnect();
  const chips = document.querySelectorAll('.chip');
  const sections = document.querySelectorAll('.menu-section');

  observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const id = entry.target.id.replace('sec-', '');
        chips.forEach(c => c.classList.toggle('active', c.dataset.section === id));
        // scroll active chip into view in the chip bar
        const activeChip = document.querySelector(`.chip[data-section="${id}"]`);
        if (activeChip) activeChip.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }
    });
  }, { rootMargin: '-98px 0px -55% 0px', threshold: 0 });

  sections.forEach(s => observer.observe(s));
}

// ── LANG BUTTONS ──────────────────────────────────────────────────────────────
function initLangButtons() {
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => setLang(btn.dataset.lang));
  });
}

// ── INIT ──────────────────────────────────────────────────────────────────────
renderChips();
renderSections();
renderAllergenGrids();
renderStrings();
initCollapsible();
initLangButtons();
initScrollSpy();
</script>
